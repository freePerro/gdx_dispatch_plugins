[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gdx-plugin-n8n"
version = "0.1.0"
description = "In-app n8n Automations console: watch the live GDX event stream your n8n workflows trigger on, plus setup + event catalog. Built on the public plugin API (the WordPress model)."
requires-python = ">=3.11"
dependencies = []

# Registers under the gdx.modules entry-point group so plugin-host discovery
# finds `manifest` after `pip install`.
[project.entry-points."gdx.modules"]
n8n = "gdx_plugin_n8n:manifest"

[tool.setuptools]
packages = ["gdx_plugin_n8n"]

# Storefront listing — see build_catalog.py for why this is declared statically
# rather than read from the manifest. `permissions` is shown to the owner
# BEFORE install, which is the whole point of declaring it here.
[tool.gdx.catalog]
name = "n8n Automations"
tier = "starter"
permissions = ["events"]
description = "Watch the live GDX event stream your n8n workflows trigger on, plus setup and an event catalog."
author = "GDX Dispatch"
