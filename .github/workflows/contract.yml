# Contract tests — run a plugin against the real core plugin_api surface.
#
# Unlike build.yml (which only packages), this IMPORTS the plugin, so it needs
# gdx_dispatch.plugin_api on the path. We shallow-clone core and put it on
# PYTHONPATH instead of doing a full core install.
#
# Two shapes of job:
# - a data-only pack (hvac): plugin_api is stdlib-only, so nothing else is
#   installed;
# - a router-bearing plugin (cellcomms): importing it pulls core's DB/web
#   stack, so the job installs core's requirement SET (requirements.txt —
#   ranges, not exact pins; the same set the plugin-host image installs) and
#   nothing else. A plugin importing a library the image lacks fails here
#   instead of failing silently at plugin-host boot (a manifest that raises on
#   import is dropped, not reported).
name: contract

on:
  push:
    branches: [main]
  pull_request:
  # Core changes never fire this workflow, and once core drops its in-tree copy
  # of cellcomms (core PR #763) this repo's CI is that plugin's only guard. A
  # weekly run against core main surfaces a broken contract within days rather
  # than on the next PR here; dispatch lets a core PR author check on demand.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

jobs:
  hvac-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Shallow-clone core for the plugin_api contract
        run: git clone --depth 1 https://github.com/freePerro/gdx_dispatch.git _core
      - name: Run hvac manifest-shape contract test
        run: |
          python -m pip install --upgrade pip pytest
          # _core is the core repo root (contains the gdx_dispatch/ package);
          # gdx-plugin-hvac holds the gdx_plugin_hvac package under test.
          PYTHONPATH="$PWD/_core:$PWD/gdx-plugin-hvac" \
            python -m pytest gdx-plugin-hvac/tests -v

  cellcomms-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # what the app (python:3.12-slim) and plugin-host (playwright noble, 3.12) images run
      - name: Shallow-clone core for plugin_api and the cell-gateway shim
        run: git clone --depth 1 https://github.com/freePerro/gdx_dispatch.git _core
      - name: Install core's requirement set (what the plugin-host image installs)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r _core/gdx_dispatch/requirements.txt pytest
      - name: Run the cellcomms suite (plugin half + shim relay end to end)
        run: |
          # Core's auth module refuses to import without a signing key, and the
          # relay test imports the real shim. A throwaway key, minted per run.
          export JWT_SECRET="$(python -c 'import secrets; print(secrets.token_hex(32))')"
          PYTHONPATH="$PWD/_core:$PWD/gdx-plugin-cellcomms" \
            python -m pytest gdx-plugin-cellcomms/tests -v
